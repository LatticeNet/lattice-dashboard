<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Evidence harness</title>
    <!-- Follow the system scheme unless a mode was saved, so a headless
         browser's prefers-color-scheme picks light or dark. -->
    <script src="./evidenceTheme.js"></script>
    <script src="/theme-init.js"></script>
    <!-- The app pins html, body and #app to the viewport and scrolls inside
         its own main pane; the harness lets the document scroll instead, so a
         full-page screenshot shows the whole layer. -->
    <style>
      html, body, #app { height: auto; min-height: 100%; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./evidenceHarness.ts"></script>
  </body>
</html>
